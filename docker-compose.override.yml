services:
  server:
    build:
      dockerfile: Dockerfile.dev
      args:
        NODE_ENV: development
    environment:
      NODE_ENV: development
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build:
      dockerfile: Dockerfile.dev
      args:
        NODE_ENV: development
    environment:
      NODE_ENV: development
    volumes:
      - ./client:/app
      - /app/node_modules  